<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Source of truth for Marity's visual identity: a cursor/pointer kite on a
    rounded-square gradient badge. The same gradient stops and normalized
    polygon points (0.24,0.24) (0.43,0.70) (0.50,0.66) (0.70,0.43) are
    reproduced in src/Marity/TrayIconFactory.cs for the live tray icon, so
    both stay visually identical.
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#bg)"/>
  <polygon points="61,61 110,179 128,169 179,110"
           fill="#FFFFFF"
           stroke="#1E1B4B" stroke-opacity="0.35" stroke-width="13" stroke-linejoin="round"/>
</svg>
